# The bundle patch the DSH loader reads (dsh.bundle.patch): a top-level YAML array
# of loader patch entries. One insert row for the adapter module; `name` is the
# package specifier, resolved through the profile's node_modules when the package
# is managed by the dsh plugin CLI. Set provider/model to the model the harness
# already uses, or leave them empty to run the deterministic layers only (the
# operator is asked for every consequential call).
- insert:
    - id: notnativereviewer
      name: notnativereviewer
      config:
        provider: ""
        model: ""
